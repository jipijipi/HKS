- question: Où se trouve la Résidence LE 25 à Casablanca ?
  answer: La résidence se situe rue des Courlis, dans le quartier Riviera–Oasis, à proximité de Casablanca Finance City (CFC) et d’Anfa Park. Le plan de situation ci-dessous vous permet de repérer son emplacement.
- question: Quels appartements et studios sont proposés ?
  answer: La résidence propose des appartements de deux ou trois chambres et des studios meublés. Consultez les configurations pour comparer les surfaces, les équipements et les plans de chaque typologie.
- question: Les logements disposent-ils d’un parking et d’une terrasse ?
  answer: Une place de parking privative est prévue par unité. Certains appartements et studios disposent également d’une terrasse ; sa surface est indiquée sur la fiche de la configuration concernée.
- question: Comment connaître les tarifs et organiser une visite ?
  answer: Contactez Sicorep Immobilier par le formulaire ou par email pour confirmer les disponibilités, les tarifs, le mobilier inclus et les options de location ou d’acquisition et les conditions proposées. Depuis une fiche de bien, le bouton « Organiser une visite » précise automatiquement le bien concerné dans votre demande.
