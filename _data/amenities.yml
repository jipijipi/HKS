title: Une résidence haut standing sécurisée à Casablanca
subtitle: Des prestations concrètes pour votre confort à Riviera–Oasis, avec des espaces résidentiels, des bureaux et des locaux commerciaux.
items:
  - Entrées sécurisées avec contrôle électronique.
  - Gardiennage 24/24 et vidéosurveillance.
  - Parking privatif (1 place/unité).
  - Climatisation individualisée.
  - Accès séparé pour les bureaux.
