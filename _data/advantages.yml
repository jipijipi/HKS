title: Vivre à Casablanca, quartier Riviera–Oasis
subtitle: Sur la rue des Courlis, la Résidence LE 25 associe un cadre résidentiel à la proximité de Casablanca Finance City (CFC) et d’Anfa Park.
items:
  - title: Un quartier pour le quotidien
    copy: Cafés, commerces et services de proximité accompagnent la vie de quartier à Riviera–Oasis.
  - title: Proche de CFC et d’Anfa Park
    copy: Un emplacement pour habiter à proximité du quartier d’affaires de Casablanca Finance City, avec un accès aux grands axes vers l’aéroport Mohammed V et la corniche.
  - title: Appartements de 2 ou 3 chambres
    copy: Des configurations adaptées à différents besoins, avec cuisine équipée, double vitrage et isolation phonique. Certains appartements disposent d’une terrasse privative ; les surfaces et les plans sont détaillés ci-dessous.
