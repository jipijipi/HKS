<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'fr' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" as="image" type="image/webp" href="{{ "/photos/facade02.webp" | relative_url }}" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&amp;family=Poiret+One&amp;family=Work+Sans:wght@300;400;600&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&amp;family=Poiret+One&amp;family=Work+Sans:wght@300;400;600&amp;display=swap" /></noscript>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
    <style>
      :root {
        --hero-bg-image: url("{{ '/photos/facade02.jpg' | relative_url }}");
        --hero-bg-image: image-set(url("{{ '/photos/facade02.webp' | relative_url }}") type("image/webp"), url("{{ '/photos/facade02.jpg' | relative_url }}") type("image/jpeg"));
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/icons/favicon.svg' | relative_url }}" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32x32.png' | relative_url }}" />
    <link rel="alternate icon" type="image/png" sizes="16x16" href="{{ '/assets/icons/favicon-16x16.png' | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-icon-180x180.png' | relative_url }}" />
    <link rel="manifest" href="{{ '/assets/icons/manifest.json' | relative_url }}" />
    {% seo %}
  </head>
  <body>
    <main class="page">
      {{ content }}
    </main>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    <footer class="footer">
      <div class="container footer__inner">
        <div class="footer__brand">
          <img class="footer__logo" src="{{ '/photos/logo-courlis-w.svg' | relative_url }}" alt="Logo Résidence LE 25" width="490" height="490" loading="lazy" />
          <p>© Sicorep Immobilier — Casablanca, Maroc</p>
        </div>
        <p class="footer__links">
          <a href="mailto:sicorep.imo@gmail.com" class="link">sicorep.imo@gmail.com</a>
        </p>
      </div>
    </footer>
  </body>
</html>
