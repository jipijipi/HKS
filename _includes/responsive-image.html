{% assign image = site.data.responsive_images[include.src] %}
{% if image %}
  {% assign fallback = image.variants | last %}
  <img src="{{ fallback.src | relative_url }}"
    srcset="{% for variant in image.variants %}{{ variant.src | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}"
    sizes="{{ include.sizes }}"
    alt="{{ include.alt | escape }}" width="{{ image.width }}" height="{{ image.height }}"
    loading="lazy" decoding="async" {% if include.gallery %}data-gallery-cover{% endif %} />
{% else %}
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy" decoding="async" {% if include.gallery %}data-gallery-cover{% endif %} />
{% endif %}
